<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Water love - 4 Sản Phẩm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f4f4; padding: 40px; }

    /* Khung chứa 4 card xếp thành 1 hàng */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* Giữ nguyên code card gốc của bạn */
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
    .title { font-size: 1.1rem; margin: 10px 0; }
    .price { color: #e53935; font-weight: bold; margin-bottom: 10px; }
    .btn { display: inline-block; padding: 8px 16px; background: #008080; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sản phẩm 1 -->
    <div class="card">
      <img src="https://congthucphache.com/wp-content/uploads/2026/05/tra-thach-dao.png" alt="Sản phẩm" />
      <h3 class="title">Freeze Trà Xanh</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>

    <!-- Sản phẩm 2 -->
    <div class="card">
      <img src="https://congthucphache.com/wp-content/uploads/2026/05/tra-thach-dao.png" alt="Sản phẩm" />
      <h3 class="title">Cà Phê Phin</h3>
      <p class="price">29.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>

    <!-- Sản phẩm 3 -->
    <div class="card">
      <img src="https://congthucphache.com/wp-content/uploads/2026/05/tra-thach-dao.png" alt="Sản phẩm" />
      <h3 class="title">Trà Thạch Vải</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>

    <!-- Sản phẩm 4 -->
    <div class="card">
      <img src="https://congthucphache.com/wp-content/uploads/2026/05/tra-thach-dao.png" alt="Sản phẩm" />
      <h3 class="title">Trà Thạch Đào</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>
  </div>

</body>
</html>
