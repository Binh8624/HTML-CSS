<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water love - Cửa hàng đồ uống</title>
  <!-- Nhúng CSS chuẩn External -->
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Thanh điều hướng & Tìm kiếm -->
    <header class="top-header">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="#" class="active">Trang chủ</a></li>
          <li><a href="#">Bánh Ngọt</a></li>
          <li><a href="#">Bánh Kem</a></li>
          <li><a href="#">Bánh Bao</a></li>
          <li><a href="#">Liên hệ</a></li>
        </ul>
        <form class="search-form" action="#">
          <input type="text" class="search-input" aria-label="Tìm kiếm" />
          <button type="submit" class="search-btn">Tìm kiếm</button>
        </form>
      </nav>

      <!-- Khu vực Logo -->
      <div class="brand-banner">
        <div class="logo-oval">
          <span class="logo-dark">Water</span> <span class="logo-light">love</span>
        </div>
      </div>
    </header>

    <!-- Nội dung chính -->
    <main class="main-content">
      <!-- Banner khuyến mãi -->
      <section class="hero-banner">
        <img 
          src="https://upload.wikimedia.org/wikipedia/vi/d/de/Mixue_Ice_Cream_%26_Tea.svg?utm_source=vi.wikipedia.org&utm_campaign=index&utm_content=original" 
          alt="Signature Festival Lễ Hội Mùa Hè" 
        />
      </section>

      <!-- Danh sách sản phẩm -->
      <section class="promo-section">
        <h2 class="section-heading">Ưu Đãi Dành Riêng Cho Bạn</h2>

        <div class="drink-grid">
          <!-- Sản phẩm 1 -->
          <article class="drink-item">
            <div class="drink-thumb">
              <img src="https://cdn.nhathuoclongchau.com.vn/unsafe/800x0/tra_xanh_co_tac_dung_gi_bat_mi_cach_uong_tra_xanh_dung_cach_1_16ea2b5992.jpg" />
            </div>
            <h3 class="drink-name">Freeze Trà Xanh</h3>
            <div class="drink-price">
              <span class="sale-price">25.000đ</span>
              <del class="old-price">35.000đ</del>
            </div>
          </article>

          <!-- Sản phẩm 2 -->
          <article class="drink-item">
            <div class="drink-thumb">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT66B90Z7aFxrChT4GJteDQH945-l7v6HvgBqysd3P2ghOWnYll93m4ksMm&s=10" />
            </div>
            <h3 class="drink-name">Cà phê phin Highlands</h3>
            <div class="drink-price">
              <span class="sale-price">29.000đ</span>
              <del class="old-price">37.000đ</del>
            </div>
          </article>

          <!-- Sản phẩm 3 -->
          <article class="drink-item">
            <div class="drink-thumb">
              <img src="https://bizweb.dktcdn.net/100/487/455/products/hlc-new-logo-5-1-products-socola-nongttv-1697198570114.jpg?v=1724206064737" />
            </div>
            <h3 class="drink-name">Trà Thạch Vải</h3>
            <div class="drink-price">
              <span class="sale-price">25.000đ</span>
              <del class="old-price">35.000đ</del>
            </div>
          </article>

          <!-- Sản phẩm 4 -->
          <article class="drink-item">
            <div class="drink-thumb">
              <img src="https://congthucphache.com/wp-content/uploads/2026/05/tra-thach-dao.png" /> 
            </div>
            <h3 class="drink-name">Trà Thạch Đào</h3>
            <div class="drink-price">
              <span class="sale-price">25.000đ</span>
              <del class="old-price">35.000đ</del>
            </div>
          </article>
        </div>
      </section>
    </main>

    <!-- Chân trang -->
    <footer class="site-footer">
      <p>Copyright © 2024 Design by Ochine</p>
    </footer>
  </div>
</body>
</html>
